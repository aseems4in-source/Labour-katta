# Builds the BUILDMATE Android APK on GitHub's servers.
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions →
#   Variables: APP_URL = https://your-app.onrender.com   (required)
#   Secrets (optional, for a signed release you can publish on Play Store):
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Run: Actions tab → "Build Android APK" → Run workflow. Download the APK from the run's Artifacts.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check APP_URL
        run: |
          if [ -z "${{ vars.APP_URL }}" ]; then echo "Set the APP_URL repository variable to your server address (https://...)"; exit 1; fi

      - name: Prepare signing key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "LK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          LK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          TASK=assembleDebug
          if [ -n "$LK_KEYSTORE_FILE" ]; then TASK="assembleRelease bundleRelease"; fi
          gradle $TASK -PappUrl="${{ vars.APP_URL }}" -PversionCode=${{ github.run_number }} --no-daemon

      - name: Name the files
        run: |
          mkdir -p out
          for f in $(find android/app/build/outputs -name '*.apk' -o -name '*.aab'); do
            ext="${f##*.}"; kind=$(basename "$(dirname "$f")")
            cp "$f" "out/BUILDMATE-${kind}-${{ github.run_number }}.${ext}"
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: BUILDMATE-android-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
