<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BUILDMATE">
  <defs>
    <linearGradient id="bm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4BA35"/>
      <stop offset="1" stop-color="#DB8F0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bm-bg)"/>
  <!-- one roof over two buildings: one platform -->
  <path d="M88 238 L256 106 L424 238" fill="none" stroke="#1C1B19" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- two buildings -->
  <rect x="136" y="250" width="100" height="168" rx="12" fill="#1C1B19"/>
  <rect x="276" y="222" width="100" height="196" rx="12" fill="#1C1B19"/>
  <!-- windows -->
  <g fill="#F4BA35">
    <rect x="158" y="276" width="22" height="22" rx="4"/><rect x="192" y="276" width="22" height="22" rx="4"/>
    <rect x="158" y="316" width="22" height="22" rx="4"/>
    <rect x="158" y="356" width="22" height="22" rx="4"/><rect x="192" y="356" width="22" height="22" rx="4"/>
    <rect x="298" y="248" width="22" height="22" rx="4"/><rect x="332" y="248" width="22" height="22" rx="4"/>
    <rect x="332" y="288" width="22" height="22" rx="4"/>
    <rect x="298" y="328" width="22" height="22" rx="4"/><rect x="332" y="328" width="22" height="22" rx="4"/>
  </g>
  <!-- the connection: a bridge with a link node between the two buildings -->
  <g fill="none" stroke-linecap="round">
    <rect x="214" y="292" width="46" height="30" rx="15" stroke="#1C1B19" stroke-width="16"/>
    <rect x="252" y="292" width="46" height="30" rx="15" stroke="#1C1B19" stroke-width="16"/>
    <rect x="214" y="292" width="46" height="30" rx="15" stroke="#FFF8E7" stroke-width="7"/>
    <rect x="252" y="292" width="46" height="30" rx="15" stroke="#FFF8E7" stroke-width="7"/>
  </g>
  <!-- the door: a dream to walk into -->
  <rect x="304" y="372" width="44" height="46" rx="8" fill="#FFF8E7"/>
  <!-- ground -->
  <path d="M108 436 L404 436" stroke="#1C1B19" stroke-width="18" stroke-linecap="round"/>
</svg>
